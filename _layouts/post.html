---
layout: default
---
<article class="post">
  <a class="back" href="{{ '/devlog/' | relative_url }}">← All news</a>
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
  <div class="prose"{% unless page.image %} style="margin-top:36px"{% endunless %}>
    {{ content }}
  </div>
</article>
