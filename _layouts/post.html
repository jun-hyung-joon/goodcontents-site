---
layout: default
---
<main class="wrap">
  <article class="post">
    <a href="{{ '/devlog/' | relative_url }}">← Devlog</a>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="margin-top:20px">{% endif %}
    <div class="prose">
      {{ content }}
    </div>
  </article>
</main>
