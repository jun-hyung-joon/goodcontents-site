<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060607">
<script>document.documentElement.classList.add('js')</script>
<title>{% if page.title %}{{ page.title }} — {% endif %}GOOD CONTENTS{% unless page.title %} — Game Development Studio{% endunless %}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GOOD CONTENTS">
<meta property="og:title" content="{{ page.title | default: 'GOOD CONTENTS — We connect the things people love.' }}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f5c542' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}"><i></i><span>GOOD CONTENTS</span></a>
    <nav><a href="{{ '/#samjoko' | relative_url }}">Samjoko</a><a class="opt" href="{{ '/#how' | relative_url }}">Studio</a><a href="{{ '/devlog/' | relative_url }}">Devlog</a><a href="{{ '/#contact' | relative_url }}">Contact</a></nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <span>© {{ site.time | date: '%Y' }} GOOD CONTENTS. All rights reserved.</span>
    <a href="mailto:contact@goodcontents.co.kr">contact@goodcontents.co.kr</a>
  </div>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
