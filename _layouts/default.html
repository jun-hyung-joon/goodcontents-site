<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}GOOD CONTENTS</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GOOD CONTENTS">
<meta property="og:title" content="{{ page.title | default: 'GOOD CONTENTS' }}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<div class="gnav">
  <div class="in">
    <a class="brand" href="{{ '/' | relative_url }}">GOOD CONTENTS</a>
    <nav><a href="{{ '/#samjoko' | relative_url }}">Samjoko</a><a href="{{ '/devlog/' | relative_url }}">Devlog</a><a href="{{ '/#contact' | relative_url }}">Contact</a></nav>
  </div>
</div>

<main>
{{ content }}
</main>

<footer>
  <div class="in">
    <span>Copyright © {{ site.time | date: '%Y' }} GOOD CONTENTS. All rights reserved.</span>
    <a href="mailto:contact@goodcontents.co.kr">contact@goodcontents.co.kr</a>
  </div>
</footer>
</body>
</html>
