<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}GOOD CONTENTS{% unless page.title %} — Game Development Studio{% endunless %}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: 'GOOD CONTENTS — Game Development Studio' }}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f5c542' stroke-width='3.5'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0f1012;--fg:#ececec;--mute:#9a9ca3;--line:#25272c;--accent:#f5c542;--card:#16171a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  img{max-width:100%;height:auto;display:block}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--fg);font-size:15px}
  .logo:hover{text-decoration:none}
  .logo i{width:22px;height:22px;border:4px solid var(--accent);border-radius:50%;flex:none}
  nav a{color:var(--mute);margin-left:22px;font-size:15px}nav a:hover{color:var(--fg);text-decoration:none}
  .hero{padding:96px 0 80px}
  .tag{display:inline-block;font-size:13px;color:var(--accent);border:1px solid #4a3f1c;border-radius:99px;padding:3px 12px;margin-bottom:22px}
  h1{font-size:clamp(34px,6vw,54px);line-height:1.12;letter-spacing:-.03em;margin-bottom:20px}
  .lead{color:var(--mute);font-size:18px;max-width:660px}
  .lead + .lead{margin-top:14px}
  section{padding:64px 0;border-top:1px solid var(--line)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-bottom:24px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
  .card h3{font-size:24px;margin-bottom:8px;letter-spacing:-.01em}
  .card p{color:var(--mute)}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:14px;margin-top:16px;color:var(--fg)}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}
  .grid .card{padding:22px}
  .grid h3{font-size:17px;margin-bottom:6px}
  .grid p{font-size:15px}
  .posts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .post-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:var(--fg);display:flex;flex-direction:column}
  .post-card:hover{text-decoration:none;border-color:#3a3c42}
  .post-card .thumb{aspect-ratio:16/9;background:#1d1e22 center/cover no-repeat}
  .post-card .body{padding:16px 18px 20px}
  .post-card time,.post time{font-size:13px;color:var(--mute)}
  .post-card h3{font-size:17px;line-height:1.35;margin:4px 0 6px}
  .post-card p{font-size:14px;color:var(--mute)}
  .more{display:inline-block;margin-top:20px;font-size:15px}
  .empty{color:var(--mute)}
  .post{padding:56px 0 72px}
  .post h1{font-size:clamp(28px,5vw,42px);margin:6px 0 24px}
  .post .cover{border-radius:14px;margin-bottom:28px;border:1px solid var(--line)}
  .prose{font-size:17px;max-width:700px}
  .prose p,.prose ul,.prose ol{margin-bottom:18px;color:#d4d5d9}
  .prose ul,.prose ol{padding-left:22px}
  .prose h2{font-size:22px;text-transform:none;letter-spacing:-.01em;color:var(--fg);margin:36px 0 12px}
  .prose img{border-radius:12px;margin:8px 0 6px;border:1px solid var(--line)}
  .prose em{color:var(--mute);font-size:14px}
  dl{display:grid;grid-template-columns:150px 1fr;gap:10px 20px;font-size:15px}
  dt{color:var(--mute)}
  dd{overflow-wrap:anywhere}
  footer{border-top:1px solid var(--line);padding:32px 0 48px;color:var(--mute);font-size:13px;line-height:1.8}
  @media(min-width:1200px){.wrap{max-width:1000px}h1{font-size:60px}.lead{font-size:19px}}
  @media(max-width:820px){.posts{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){body{font-size:15px}.wrap{padding:0 16px}nav a{margin-left:14px;font-size:14px}.hero{padding:56px 0 48px}.br{display:none}.lead{font-size:16px}section{padding:48px 0}.card{padding:22px}.card h3{font-size:21px}.grid,.posts{grid-template-columns:1fr}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:12px}.prose{font-size:16px}}
  @media(max-width:360px){.logo span{display:none}nav a{margin-left:10px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}"><i></i><span>GOOD CONTENTS</span></a>
    <nav><a href="{{ '/#games' | relative_url }}">Games</a><a href="{{ '/devlog/' | relative_url }}">Devlog</a><a href="{{ '/#contact' | relative_url }}">Contact</a></nav>
  </div>
</header>

{{ content }}

<footer>
  <div class="wrap">
    GOOD CONTENTS · Seoul, Republic of Korea · <a href="mailto:contact@goodcontents.co.kr">contact@goodcontents.co.kr</a><br>
    © {{ site.time | date: '%Y' }} GOOD CONTENTS. All rights reserved.
  </div>
</footer>
</body>
</html>
