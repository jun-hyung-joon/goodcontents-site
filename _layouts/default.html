<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>{% if page.title %}{{ page.title }} | {% endif %}GOOD CONTENTS</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GOOD CONTENTS">
<meta property="og:title" content="{{ page.title | default: 'GOOD CONTENTS' }}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% assign ogimg = page.image | default: site.data.media.studio_visual %}{% if ogimg and ogimg != '' %}<meta property="og:image" content="{{ ogimg | absolute_url }}">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090d18'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23b8322a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="gh">
  <div class="wrap">
    <a class="studio" href="{{ '/' | relative_url }}">GOOD CONTENTS</a>
    <nav>
      <a href="{{ '/#games' | relative_url }}">GAMES</a>
      <a href="{{ '/news/' | relative_url }}">NEWS</a>
      <a href="{{ '/#about' | relative_url }}">ABOUT</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <span class="studio">GOOD CONTENTS</span>
    <span>Business inquiries <a href="mailto:contact@goodcontents.co.kr">contact@goodcontents.co.kr</a></span>
    <span>&copy; {{ site.time | date: '%Y' }} GOOD CONTENTS</span>
  </div>
</footer>
</body>
</html>
